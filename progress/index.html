<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rex 识字</title>
<style>
:root{
  --blue:#00A8E8;      /* Bluey 蓝 */
  --deep-blue:#0073C6;
  --red:#FF3D00;       /* 汪汪队红 */
  --yellow:#FFD600;    /* 汪汪队黄 */
  --orange:#FF8C00;
  --green:#43D17C;
  --ink:#1b2a41;
  --muted:#7a8ba0;
  --bg1:#eaf7ff;
  --bg2:#fff6e0;
  --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#eaf7ff 0%,#e6f4ff 30%,#fff6e0 100%);min-height:100vh;color:var(--ink);padding-bottom:70px}
.tab-bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  display:flex;border-bottom:2px solid #e8f0f7;box-shadow:0 2px 10px rgba(0,115,198,.06)}
.tab-btn{flex:1;padding:14px 0;text-align:center;font-size:15px;font-weight:700;color:var(--muted);
  cursor:pointer;border:none;background:none;position:relative;transition:color .2s}
.tab-btn.active{color:var(--deep-blue)}
.tab-btn.active::after{content:"";position:absolute;bottom:0;left:25%;right:25%;height:3px;
  border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--red),var(--yellow),var(--blue))}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.header{text-align:center;padding:28px 20px 4px}
.header h1{font-size:30px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(120deg,var(--deep-blue),var(--red));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:13px;color:var(--muted);margin-top:6px}
.header .paw{font-size:15px;letter-spacing:2px;margin-top:2px}

.ring-wrap{display:flex;justify-content:center;margin:14px 0 4px}
.ring-pct{font-size:30px;font-weight:900;fill:var(--deep-blue)}
.ring-label{font-size:13px;fill:var(--muted)}
.ring-text{font-size:12px;fill:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:14px;padding:12px 4px;text-align:center;box-shadow:0 2px 10px rgba(0,115,198,.05)}
.stat-num{font-size:21px;font-weight:800}
.stat-label{font-size:11px;color:var(--muted);margin-top:3px}
.section{padding:0 14px;margin-bottom:16px}
.section-title{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:10px;padding-left:4px;
  display:flex;align-items:center;gap:6px}
.section-title .bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--red),var(--yellow))}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,115,198,.06)}

/* 字云 */
.cloud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 0}
.cloud-char{font-weight:700;padding:4px 10px;border-radius:12px;background:#f0f8ff;border:1px solid #e0edf7;transition:transform .15s}
.cloud-char:active{transform:scale(1.12)}

/* 已学字墙 */
.wall{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wall-char{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;
  border-radius:14px;background:linear-gradient(135deg,#b8ecd0,#43d17c);color:#0d5c2e;font-size:20px;
  font-weight:800;box-shadow:0 3px 8px rgba(67,209,124,.25)}

/* 书库 */
.book-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:#455a70;border-bottom:1px solid #f3f8fc}
.book-row:last-child{border:none}
.book-count{color:var(--muted);font-size:12px}

/* 认字卡片 */
.ety-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 0}
.ety-char{width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:14px;font-size:24px;font-weight:800;background:#fff;border:2px solid #e2eef7;
  cursor:pointer;transition:all .15s;position:relative}
.ety-char.learned{border-color:#43d17c;background:#f0fdf5}
.ety-char.picto{border-color:#ffd600;background:#fffbe6}
.ety-char:active{transform:scale(.92)}
.ety-char .dot{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.ety-filter{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.ety-filter button{padding:7px 14px;border-radius:99px;border:2px solid #e2eef7;background:#fff;color:var(--muted);
  font-size:13px;font-weight:700;cursor:pointer}
.ety-filter button.active{border-color:var(--blue);color:var(--deep-blue);background:#eaf7ff}

/* 字源详情弹层 */
.modal{position:fixed;inset:0;background:rgba(15,30,50,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:24px;max-width:360px;width:100%;padding:24px;text-align:center;
  animation:pop .2s;max-height:85vh;overflow:auto}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-char{font-size:84px;font-weight:900;line-height:1;color:var(--ink)}
.modal-type{display:inline-block;margin:10px 0 4px;padding:5px 16px;border-radius:99px;font-size:14px;font-weight:800;
  background:linear-gradient(120deg,var(--red),var(--orange));color:#fff}
.modal-type.picto{background:linear-gradient(120deg,var(--yellow),var(--orange));color:#7a4d00}
.modal-type.ideo{background:linear-gradient(120deg,var(--blue),var(--deep-blue))}
.modal-type.phon{background:linear-gradient(120deg,var(--green),#0d9e52)}
.modal-hint{font-size:16px;color:var(--ink);line-height:1.7;margin:14px 0;background:#f6fbff;border-radius:14px;padding:14px}
.modal-meta{font-size:12px;color:var(--muted);line-height:1.6}
.modal-close{margin-top:16px;padding:10px 0;width:100%;border:none;border-radius:12px;
  background:linear-gradient(90deg,var(--blue),var(--deep-blue));color:#fff;font-size:15px;font-weight:700;cursor:pointer}

/* 复习 */
.game-card{text-align:center;padding:20px 0}
.game-char{font-size:88px;font-weight:900;color:var(--ink);margin:12px 0 6px}
.game-context{font-size:13px;color:var(--muted);margin-bottom:20px;min-height:20px}
.game-btns{display:flex;gap:14px;justify-content:center;margin:14px 0}
.btn-know{background:linear-gradient(135deg,#b8ecd0,#43d17c);border:none;color:#0d5c2e;font-size:17px;font-weight:800;
  padding:15px 30px;border-radius:16px;cursor:pointer;box-shadow:0 4px 12px rgba(67,209,124,.3)}
.btn-not{background:linear-gradient(135deg,#ffc9b8,#ff6b4a);border:none;color:#8a2200;font-size:17px;font-weight:800;
  padding:15px 30px;border-radius:16px;cursor:pointer;box-shadow:0 4px 12px rgba(255,107,74,.3)}
.btn-know:active,.btn-not:active{transform:scale(.94)}
.btn-start{background:linear-gradient(135deg,var(--blue),var(--deep-blue));border:none;color:#fff;font-size:16px;
  font-weight:800;padding:14px 42px;border-radius:16px;cursor:pointer;box-shadow:0 4px 12px rgba(0,168,232,.3)}
.game-due{font-size:16px;font-weight:800;color:var(--deep-blue);margin-bottom:10px}
.game-summary{text-align:center;padding:28px 0}
.game-summary h3{font-size:20px;font-weight:900;margin-bottom:8px}
.game-summary p{font-size:14px;color:#55687e;margin-bottom:4px}

.empty-state{text-align:center;color:var(--muted);padding:26px 0;font-size:14px;line-height:1.8}
.footer{text-align:center;font-size:11px;color:#b0c0d0;padding:16px}
.page-loading{text-align:center;padding:56px 20px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<div class="tab-bar">
  <div class="tab-btn active" data-tab="dashboard">📖 进度</div>
  <div class="tab-btn" data-tab="learn">🔍 认字</div>
  <div class="tab-btn" data-tab="review">🎮 复习</div>
</div>

<div id="tab-dashboard" class="tab-content active"><div class="page-loading">加载中…</div></div>
<div id="tab-learn" class="tab-content"><div class="page-loading">加载中…</div></div>
<div id="tab-review" class="tab-content"><div class="page-loading">加载中…</div></div>

<script>
const INTERVALS=[1,2,4,7,15,30];
const COLORS=['#FF3D00','#00A8E8','#FFD600','#FF8C00','#43D17C','#0073C6','#FF6B4A','#9B59B6'];
const TODAY=new Date().toISOString().slice(0,10);

let S={progress:{},learned:[],charMeta:{},ety:{},known:new Set(),
       reviewQueue:[],reviewIdx:0,reviewRes:{ok:0,fail:0},reviewing:false,loaded:false};

async function init(){
  try{
    await Promise.all([fetchData(),fetchEty()]);
    computeKnown();
    renderDashboard();renderLearn();renderReview();
    initTabs();S.loaded=true;
  }catch(e){
    document.querySelectorAll('.tab-content').forEach(el=>el.innerHTML='<div class="page-loading">加载失败，请刷新重试</div>');
  }
}
async function safeFetch(u){try{const r=await fetch(u);if(!r.ok)return null;return r;}catch(e){return null;}}
async function fetchData(){
  const [data,learned,meta]=await Promise.all([
    safeFetch('./data.json?v=3').then(r=>r?r.json():{progress:{}}),
    safeFetch('./learned.json').then(r=>r?r.json():{learned:[]}),
    safeFetch('./char_meta.json').then(r=>r?r.json():{chars:{}})
  ]);
  S.progress=data.progress||{};S.learned=learned.learned||[];S.charMeta=meta.chars||{};
}
async function fetchEty(){
  const e=await safeFetch('./char_etymology.json').then(r=>r?r.json():{chars:{}});
  S.ety=e.chars||{};
}
function computeKnown(){
  const s=new Set();
  for(const it of S.learned)s.add(it.char);
  for(const c of Object.keys(S.charMeta))if(S.charMeta[c].status==='已学')s.add(c);
  S.known=s;
}
function initTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
      if(btn.dataset.tab==='review'&&S.loaded)renderReview();
    });
  });
}

/* ===== 进度 ===== */
function renderDashboard(){
  const p=S.progress;
  const total=p.total_unique_chars||Object.keys(S.charMeta).length||0;
  const known=S.known.size;
  const pct=total?((known/total)*100).toFixed(1):0;
  const lastUp=(p.last_updated||'').slice(0,10)||TODAY;

  const topUntouched=Object.entries(S.charMeta).filter(([,v])=>v.status!=='已学')
    .sort(([,a],[,b])=>b.freq-a.freq).slice(0,24);
  const cloud=topUntouched.map(([c,info],i)=>
    `<span class="cloud-char" style="font-size:${14+(info.freq/50)*14}px;color:${COLORS[i%COLORS.length]}">${c}</span>`).join('');

  const knownArr=Array.from(S.known);
  const wall=knownArr.map(c=>`<span class="wall-char">${c}</span>`).join('')||'<div class="empty-state">还没有已学汉字，读完绘本去息流记录吧 🐾</div>';

  const bookFreq={};
  for(const c of Object.keys(S.charMeta))for(const b of(S.charMeta[c].books||[]))bookFreq[b]=(bookFreq[b]||0)+1;
  const bookRows=Object.entries(bookFreq).sort(([,a],[,b])=>b-a).slice(0,40)
    .map(([t,n])=>`<div class="book-row"><span>${t}</span><span class="book-count">${n}字</span></div>`).join('');

  document.getElementById('tab-dashboard').innerHTML=`
    <div class="header">
      <h1>Rex 认字</h1>
      <div class="sub">更新于 ${lastUp} · ${p.total_books||0} 本书</div>
      <div class="paw">🐾 🐾 🐾</div>
    </div>
    <div class="ring-wrap">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="64" fill="none" stroke="#e2edf5" stroke-width="11"/>
        <circle cx="75" cy="75" r="64" fill="none" stroke="url(#g)" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="${(pct*4.02).toFixed(2)} ${(402-pct*4.02).toFixed(2)}" transform="rotate(-90 75 75)"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FF3D00"/><stop offset="50%" stop-color="#FFD600"/><stop offset="100%" stop-color="#00A8E8"/>
        </linearGradient></defs>
        <text x="75" y="68" text-anchor="middle" class="ring-pct">${pct}%</text>
        <text x="75" y="88" text-anchor="middle" class="ring-label">已认识</text>
        <text x="75" y="104" text-anchor="middle" class="ring-text">${known}/${total}</text>
      </svg>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="stat-num" style="color:#0073C6">${total}</div><div class="stat-label">总字库</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#0d9e52">${known}</div><div class="stat-label">已认识</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#FF3D00">${p.untouched??(total-known)}</div><div class="stat-label">未学</div></div>
      <div class="stat-card"><div class="stat-num" style="color:#9B59B6">${p.total_books||0}</div><div class="stat-label">书籍</div></div>
    </div>
    <div class="section"><div class="section-title"><span class="bar"></span>高频未学</div>
      <div class="card"><div class="cloud">${cloud||'<div class="empty-state">所有字都认识啦 🎉</div>'}</div></div></div>
    <div class="section"><div class="section-title"><span class="bar"></span>已认识（${known}）</div>
      <div class="card"><div class="wall">${wall}</div></div></div>
    <div class="section"><div class="section-title"><span class="bar"></span>绘本书库</div>
      <div class="card">${bookRows||'<div class="empty-state">暂无书籍</div>'}</div></div>
    <div class="footer">🐾 每天 10:00 自动更新 · 数据来自息流</div>`;
}

/* ===== 认字（字源） ===== */
let etyFilter='all';
function renderLearn(){
  const chars=S.charMeta;
  const entries=Object.keys(chars).sort((a,b)=>chars[b].freq-chars[a].freq);
  const picto=entries.filter(c=>(S.ety[c]||{}).type==='pictographic');
  const learnedArr=entries.filter(c=>S.known.has(c));

  document.getElementById('tab-learn').innerHTML=`
    <div class="header"><h1>🔍 认字</h1><div class="sub">点一个字，看它从哪里来</div></div>
    <div class="section" style="margin-top:14px">
      <div class="ety-filter">
        <button data-f="all" class="active">全部</button>
        <button data-f="picto">🐾 象形字</button>
        <button data-f="learned">✅ 已认识</button>
      </div>
      <div class="card"><div class="ety-grid" id="ety-grid"></div></div>
    </div>`;
  document.querySelectorAll('.ety-filter button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.ety-filter button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');etyFilter=b.dataset.f;fillEtyGrid();
  }));
  fillEtyGrid();
}
function fillEtyGrid(){
  const grid=document.getElementById('ety-grid');
  const chars=S.charMeta;
  let list=Object.keys(chars).sort((a,b)=>chars[b].freq-chars[a].freq);
  if(etyFilter==='picto')list=list.filter(c=>(S.ety[c]||{}).type==='pictographic');
  else if(etyFilter==='learned')list=list.filter(c=>S.known.has(c));
  list=list.slice(0,80);
  grid.innerHTML=list.map(c=>{
    const t=(S.ety[c]||{}).type;
    const cls=[S.known.has(c)?'learned':'',t==='pictographic'?'picto':''].filter(Boolean).join(' ');
    const dot=S.known.has(c)?'<span class="dot"></span>':'';
    return `<span class="ety-char ${cls}" data-c="${c}">${c}${dot}</span>`;
  }).join('')||'<div class="empty-state">暂无字</div>';
  grid.querySelectorAll('.ety-char').forEach(el=>el.addEventListener('click',()=>openModal(el.dataset.c)));
}
function openModal(c){
  const e=S.ety[c]||{};
  const type=e.type_cn||'';
  const tcls=e.type==='pictographic'?'picto':(e.type==='ideographic'?'ideo':'phon');
  const hint=e.hint_cn||e.hint_en||'这个字的来源暂未收录';
  const pinyin=(e.pinyin&&e.pinyin.length)?e.pinyin.join(', '):'';
  const learned=S.known.has(c)?'✅ 已认识':'🌟 待认识';
  document.body.insertAdjacentHTML('beforeend',`
    <div class="modal open" id="ety-modal">
      <div class="modal-card">
        <div class="modal-char">${c}</div>
        <div class="modal-type ${tcls}">${type||'字'}</div>
        <div class="modal-hint">「${hint}」</div>
        <div class="modal-meta">
          ${learned}<br>
          ${pinyin?'拼音：'+pinyin:'<br>'}
          ${e.definition?'含义：'+e.definition:''}
        </div>
        <button class="modal-close" onclick="document.getElementById('ety-modal').remove()">知道啦 ✨</button>
      </div>
    </div>`);
}

/* ===== 复习 ===== */
function loadReviews(){try{return JSON.parse(localStorage.getItem('rex_reviews')||'{}');}catch(e){return {};}}
function saveReviews(r){localStorage.setItem('rex_reviews',JSON.stringify(r));}
function daysLater(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);}
function renderReview(){
  const el=document.getElementById('tab-review');
  if(S.reviewing)return;
  const rev=loadReviews();
  const due=Array.from(S.known).filter(c=>{const r=rev[c];return !r||!r.next_review||r.next_review<=TODAY;});
  due.sort(()=>Math.random()-0.5);
  S.reviewQueue=due.slice(0,15);S.reviewIdx=0;
  if(due.length===0){
    el.innerHTML=`<div class="game-summary"><h3>🎉 今天没有待复习的字</h3><p style="color:#7a8ba0">都复习完啦，明天再来吧</p></div>`;
    return;
  }
  el.innerHTML=`<div class="game-card">
    <div class="game-due">今天 ${due.length} 字待复习 · 本次 ${S.reviewQueue.length} 字</div>
    <button class="btn-start" onclick="startReview()">开始复习 🐾</button>
  </div>`;
}
function startReview(){S.reviewIdx=0;S.reviewRes={ok:0,fail:0};S.reviewing=true;showCard();}
function showCard(){
  const el=document.getElementById('tab-review');
  if(S.reviewIdx>=S.reviewQueue.length){
    S.reviewing=false;
    const {ok,fail}=S.reviewRes;
    el.innerHTML=`<div class="game-summary"><h3>✅ 本次复习完成</h3>
      <p>认识 ${ok} 字 · 不认识 ${fail} 字</p><p style="font-size:13px;color:#7a8ba0;margin-top:10px">明天再来巩固吧</p></div>`;
    return;
  }
  const c=S.reviewQueue[S.reviewIdx];
  const meta=S.charMeta[c];
  const ctx=meta&&meta.books&&meta.books.length?(meta.books.slice(0,2).join(' · ')):'';
  el.innerHTML=`<div class="game-card">
    <div style="font-size:13px;color:#7a8ba0">${S.reviewIdx+1}/${S.reviewQueue.length}</div>
    <div class="game-char">${c}</div>
    <div class="game-context">${ctx?'📖 '+ctx:''}</div>
    <div class="game-btns">
      <button class="btn-know" onclick="reviewChar(true)">认识 ✓</button>
      <button class="btn-not" onclick="reviewChar(false)">不认识 ✗</button>
    </div>
  </div>`;
}
function reviewChar(know){
  const c=S.reviewQueue[S.reviewIdx];
  const rev=loadReviews();
  const old=rev[c];
  if(know){
    S.reviewRes.ok++;
    const stage=old?Math.min(old.stage+1,INTERVALS.length-1):0;
    rev[c]={stage,last_review:TODAY,next_review:daysLater(TODAY,INTERVALS[stage])};
  }else{
    S.reviewRes.fail++;
    rev[c]={stage:0,last_review:TODAY,next_review:daysLater(TODAY,1)};
  }
  saveReviews(rev);
  S.reviewIdx++;showCard();
}

init();
</script>
</body>
</html>
